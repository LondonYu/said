<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Said</title>
  <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Said · Solana 链上留言板" />
    <link rel="icon" type="image/svg+xml" href="/said-favicon.svg" />
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('said-preferences') || '{}');
        const theme = saved && saved.theme;
        document.documentElement.dataset.theme = theme === 'light' || (theme === 'system' && !matchMedia('(prefers-color-scheme: dark)').matches) ? 'light' : 'dark';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
